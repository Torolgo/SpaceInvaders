<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <link rel="icon" href="assets/images/red-five_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Space Invaders</h1>
  <a href="./index.html" class="home">Home</a>
</header>
<main>
  <img id="gameImage" src="assets/images/yoda'sSentence.png" alt="yoda's Sentence : May the force be with you." class="gameImage">
  <div id="leaderboard-container" class="leaderboard-container">
    <h2>Leaderboard</h2>
    <table id="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Score</th>
          <th>Time Left</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
      </tbody>
    </table>
  </div>
  <button id="startButton">Start</button>
  <div id="gameZone" class="hidden">
    <div id="player"></div>
    <div id="score">Score: 0</div>
  </div>
  <div id="timer" class="hidden">Time: 60 s</div>
</main>
<script src="js/game.js"></script>
</body>
</html>
